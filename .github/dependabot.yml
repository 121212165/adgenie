# Generated by GitHub maintenance audit on 2026-11-09.
# Enables Dependabot version updates alongside security updates;
# raises the per-repo open PR limit so high/critical alerts get fix PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    commit-message:
      prefix: "deps"
      groups:
        all-deps:
          patterns:
            - "*"
